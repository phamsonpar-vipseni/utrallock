name: Build Utral Lock 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Lấy source
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. Java 17
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # 3. Android SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================
      # 4. Tạo Android project
      # =========================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          echo "===== Detect package ====="

          if [ ! -f MainActivity.java ]; then
            echo "ERROR: MainActivity.java not found!"
            exit 1
          fi

          PKG=$(grep -m1 '^package ' MainActivity.java \
            | sed 's/^package //' \
            | sed 's/;//' \
            | tr -d ' ')

          if [ -z "$PKG" ]; then
            PKG="com.utrallock.twopointzero"
          fi

          echo "Package: $PKG"

          PKG_PATH=$(echo "$PKG" | tr '.' '/')

          # =========================
          # Folder structure
          # =========================
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # =========================
          # MainActivity
          # =========================
          cp MainActivity.java \
            "app/src/main/java/$PKG_PATH/MainActivity.java"

          # =========================
          # Splash
          # =========================
          if [ -f splash.jpg ]; then
            cp splash.jpg \
              app/src/main/res/drawable-nodpi/splash.jpg
          fi

          # =========================
          # Icon
          # =========================
          if [ -f app_icon.png ]; then
            cp app_icon.png \
              app/src/main/res/drawable-nodpi/app_icon.png
          fi

          # =========================
          # Gradle settings
          # =========================
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "UtralLock2"

          include(":app")
          EOF

          # =========================
          # Root Gradle
          # =========================
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # =========================
          # App Gradle
          # =========================
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"

              compileSdk 35

              defaultConfig {
                  applicationId "$PKG"

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
          }
          EOF

          # =========================
          # Manifest
          # =========================
          if [ -f AndroidManifest.xml ]; then

            echo "Using repository AndroidManifest.xml"

            cp AndroidManifest.xml \
              app/src/main/AndroidManifest.xml

          else

            echo "Creating AndroidManifest.xml"

            cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:label="Utral Lock 2.0🪽"
                  android:theme="@style/Theme.UtralLock">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          fi

          # =========================
          # Strings
          # =========================
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Utral Lock 2.0🪽</string>
          </resources>
          EOF

          # =========================
          # Theme
          # =========================
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style
                  name="Theme.UtralLock"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:colorAccent">#000000</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:statusBarColor">#000000</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          # =========================
          # Colors
          # =========================
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>

              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>

          </resources>
          EOF

          # =========================
          # Gradle properties
          # =========================
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          android.defaults.buildfeatures.buildconfig=true
          EOF

          echo "===== Android project created ====="

      # =========================
      # 5. Build APK
      # =========================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # =========================
      # 6. Kiểm tra APK
      # =========================
      - name: Check APK
        shell: bash
        run: |
          set -e

          ls -lh app/build/outputs/apk/debug/

          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "APK BUILD SUCCESS!"

      # =========================
      # 7. Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UtralLock2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
