name: Build Utral Lock 2.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Không tìm thấy file ZIP Android."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Không tìm thấy settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # FIX KOTLIN DUPLICATE CLASSES
      # Kotlin 1.8.x đã gộp các class JDK7/JDK8 vào stdlib.
      # Ép toàn bộ Kotlin dependencies về 1.8.22.
      # =========================================================

      - name: Fix Kotlin duplicate dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          cat > kotlin-fix.init.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                          details.because("Prevent duplicate Kotlin stdlib versions")
                      }
                  }

                  resolutionStrategy.force(
                      "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  )
              }
          }
          EOF

          echo "Kotlin dependency fix installed."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew 2>/dev/null || true

          if [ -f gradlew ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --init-script kotlin-fix.init.gradle \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --init-script kotlin-fix.init.gradle \
              assembleDebug
          fi

      # =========================================================
      # CHECK APK
      # =========================================================

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "${PROJECT_DIR}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build không tạo được APK."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UtralLock2-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error
