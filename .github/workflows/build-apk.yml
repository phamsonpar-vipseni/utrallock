name: Build Utral Lock 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. CHECKOUT
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================
      # 2. JAVA 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # 3. ANDROID SDK
      # =========================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================
      # 4. INSTALL SDK
      # =========================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================
      # 5. INSTALL GRADLE
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # =========================
      # 6. CREATE PROJECT
      # =========================
      - name: Create Android project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Checking source files"
          echo "================================"

          if [ ! -f MainActivity.java ]; then
            echo "ERROR: MainActivity.java not found!"
            exit 1
          fi

          echo "MainActivity.java found"

          # --------------------------------
          # Detect package
          # --------------------------------
          PKG=$(grep -m1 '^package ' MainActivity.java 2>/dev/null \
            | sed 's/^package //' \
            | sed 's/;//' \
            | tr -d ' ')

          if [ -z "$PKG" ]; then
            PKG="com.utrallock.twopointzero"
          fi

          echo "Detected package: $PKG"

          PKG_PATH=$(echo "$PKG" | tr '.' '/')

          # --------------------------------
          # Create folders
          # --------------------------------
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p "app/src/main/res/values"
          mkdir -p "app/src/main/res/drawable-nodpi"

          # --------------------------------
          # Copy MainActivity
          # --------------------------------
          cp MainActivity.java \
            "app/src/main/java/$PKG_PATH/MainActivity.java"

          # --------------------------------
          # Copy optional resources
          # --------------------------------
          if [ -f colors.xml ]; then
            cp colors.xml app/src/main/res/values/colors.xml
          fi

          if [ -f themes.xml ]; then
            cp themes.xml app/src/main/res/values/themes.xml
          fi

          if [ -f splash.jpg ]; then
            cp splash.jpg app/src/main/res/drawable-nodpi/splash.jpg
          fi

          if [ -f app_icon.png ]; then
            cp app_icon.png app/src/main/res/drawable-nodpi/app_icon.png
          fi

          # --------------------------------
          # settings.gradle
          # --------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "UtralLock2"
          include(":app")
          EOF

          # --------------------------------
          # Root build.gradle
          # --------------------------------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # --------------------------------
          # App build.gradle
          # --------------------------------
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "$PKG"
              compileSdk 35

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
          }
          EOF

          # --------------------------------
          # Manifest
          # --------------------------------
          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="Utral Lock 2.0🪽"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.UtralLock"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="$PKG.MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------
          # strings.xml
          # --------------------------------
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Utral Lock 2.0🪽</string>
          </resources>
          EOF

          # --------------------------------
          # themes.xml
          # --------------------------------
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style name="Theme.UtralLock"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          # --------------------------------
          # colors.xml
          # --------------------------------
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF
          fi

          # --------------------------------
          # Gradle properties
          # --------------------------------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          echo "================================"
          echo "Android project created"
          echo "Package: $PKG"
          echo "================================"

      # =========================
      # 7. BUILD APK
      # =========================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "Starting Gradle build..."

          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      # =========================
      # 8. CHECK APK
      # =========================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # =========================
      # 9. UPLOAD APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UtralLock2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
